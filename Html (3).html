<style>
@font-face{font-family:'TH Sarabun New';src:local('TH Sarabun New'),local('THSarabunNew');font-weight:400;font-style:normal}
@font-face{font-family:'TH Sarabun New';src:local('TH Sarabun New Bold'),local('THSarabunNew-Bold'),local('THSarabunNew Bold');font-weight:700;font-style:normal}
:root{
  --pri:#0D9488; --pri-d:#0B7A70; --pri-l:#14B8A6; --pri-bg:#F0FDFA;
  --sec:#9333EA; --sec-bg:#FAF5FF; --ter:#EC4899; --ter-bg:#FDF2F8;
  --bg:#F8FAFC; --surf:#FFFFFF;
  --ok:#10B981; --warn:#F59E0B; --err:#EF4444; --info:#3B82F6;
  --ink:#0F172A; --ink2:#334155; --mute:#64748B; --line:#E2E8F0; --line2:#F1F5F9;
  --r:8px; --r-lg:12px; --r-xl:16px;
  --sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-weight:normal;font-style:normal;display:inline-block;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
button,input,select,textarea{font-family:inherit;font-size:14px}
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#14B8A6 0,transparent 40%),linear-gradient(135deg,#0B7A70 0%,#0D9488 45%,#9333EA 100%);z-index:50;padding:16px}
.lg-card{background:#fff;border-radius:20px;padding:34px;width:min(430px,100%);box-shadow:0 25px 70px rgba(0,0,0,.3);display:grid;gap:10px}
.lg-logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--pri-l),var(--sec));display:grid;place-items:center;color:#fff;margin-bottom:4px}
.lg-logo .ms{font-size:34px}
.lg-card h2{margin:0;font-size:21px}
#lgMsg{color:var(--err);font-size:13.5px;min-height:18px}
aside{width:262px;background:#0F172A;color:#CBD5E1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center}
.brand .logo{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--pri-l),var(--sec));display:grid;place-items:center;color:#fff}
.brand b{color:#fff;font-size:15px;display:block;line-height:1.3}
.brand small{color:#94A3B8;font-size:12px}
.nav{padding:10px;flex:1;overflow:auto}
.nav .sec-t{font-size:11px;letter-spacing:.08em;color:#64748B;padding:14px 12px 6px;text-transform:uppercase}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:#CBD5E1;text-decoration:none;cursor:pointer;margin-bottom:2px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(20,184,166,.28),rgba(20,184,166,.04));color:#fff;box-shadow:inset 3px 0 0 var(--pri-l)}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side-foot b{color:#fff}
.main{margin-left:262px;min-width:0}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:10px;z-index:20}
.topbar h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}
#view{padding:22px 24px 40px;max-width:1680px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .ms{color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--pri))}
.kpi .l{color:var(--mute);font-size:13px;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--pri-l);color:var(--pri-d)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.sec{background:var(--sec);border-color:var(--sec);color:#fff}.btn.sec:hover{filter:brightness(.92)}
.btn.danger{color:var(--err);border-color:#FECACA}.btn.danger:hover{background:#FEF2F2}
.btn.okb{color:#047857;border-color:#A7F3D0}.btn.okb:hover{background:#ECFDF5}
.btn.sm{padding:4px 9px;font-size:13px}.btn.ic{padding:4px 6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--pri-l);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
.inp:disabled{background:var(--line2);color:var(--mute)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
label.f{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.fg{display:grid;gap:12px}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.span2{grid-column:span 2}.full{grid-column:1/-1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .inp{width:auto;min-width:150px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;max-height:calc(100vh - 250px);box-shadow:var(--sh)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{position:sticky;top:0;background:#F1F5F9;color:var(--ink2);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tbody tr:hover td{background:#FAFFFE}
table.t tr.g1 td{background:#F8FAFC!important;font-weight:600}
table.t tr.g0 td{background:var(--pri-bg)!important;font-weight:700;color:var(--pri-d)}
table.t tr.dh td{background:var(--sec-bg)!important;font-weight:700;color:#6B21A8}
table.t tr.chg td{background:#FFFBEB!important}
table.t tr.rej td{opacity:.6}
table.t tr.tot td{background:#0F172A!important;color:#fff;font-weight:700}
.r{text-align:right!important;font-variant-numeric:tabular-nums}.c{text-align:center!important}
.nw{white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-gray{background:#F1F5F9;color:#475569}.b-info{background:#DBEAFE;color:#1D4ED8}.b-ok{background:#D1FAE5;color:#047857}.b-warn{background:#FEF3C7;color:#B45309}.b-err{background:#FEE2E2;color:#B91C1C}.b-sec{background:var(--sec-bg);color:var(--sec)}
.flag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;margin:3px 4px 0 0;font-weight:600}
.muted{color:var(--mute)}.small{font-size:12.5px}
.hint{background:var(--sec-bg);border:1px solid #E9D5FF;color:#6B21A8;padding:10px 12px;border-radius:var(--r);font-size:13.5px}
.warnbox{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;padding:10px 12px;border-radius:var(--r);font-size:13.5px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1;min-width:110px;text-align:center;font-size:13px;padding:10px 6px;border-radius:10px;background:var(--line2);color:var(--mute)}
.step.done{background:var(--pri-bg);color:var(--pri-d);font-weight:600}
.step.cur{background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;font-weight:700}
.chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.chk:last-child{border:none}
.chk .ms{font-size:22px}.chk.ok>.ms{color:var(--ok)}.chk.warn>.ms{color:var(--warn)}.chk.err>.ms{color:var(--err)}.chk.info>.ms{color:var(--info)}
.chk b{display:block}
.mode{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.mode.fb{background:#D1FAE5;color:#047857}.mode.lc{background:#FEF3C7;color:#B45309}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--line2);padding:5px 10px;border-radius:999px;font-size:13px}
.proj{font-weight:600}.desc{color:var(--mute);font-size:12.5px;margin-top:2px;white-space:pre-line;max-width:420px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sec))}
.apv-in{width:140px!important;min-width:0!important;padding:5px 8px;font-weight:700;color:var(--pri-d)}
.sticky-k{position:sticky;top:57px;z-index:15;background:var(--bg);padding:2px 0 12px}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:100;padding:16px}
.mask.on{display:grid}
.mdl{background:#fff;border-radius:var(--r-xl);width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.mdl.wide{width:min(1000px,100%)}
.mdl-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mdl-h h3{margin:0;flex:1;font-size:17px}
.mdl-b{padding:20px;overflow:auto}
.mdl-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:300}
.tst{background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);min-width:240px;max-width:440px;animation:tin .25s}
.tst.ok{background:var(--pri-d)}.tst.err{background:var(--err)}.tst.warn{background:#D97706}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;place-items:center;z-index:250}
#busy.on{display:grid}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--pri-bg);border-top-color:var(--pri);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.page{background:#fff;width:210mm;min-height:297mm;margin:0 auto 18px;padding:15mm 13mm 13mm 20mm;box-shadow:0 4px 22px rgba(0,0,0,.12)}
@page{size:A4;margin:15mm 13mm 13mm 20mm}
@media print{
  body{background:#fff}
  aside,.topbar,.no-print,#toast,#login,.mask{display:none!important}
  .main{margin:0}#view{padding:0;max-width:none}
  .page{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;page-break-after:always}
  .page:last-child{page-break-after:auto}
  table.ngt tr{page-break-inside:avoid}
}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:960px){
  aside{transform:translateX(-100%)}aside.open{transform:none}
  .main{margin-left:0}#menuBtn{display:inline-flex}
  .c3{grid-template-columns:1fr 1fr}#view{padding:16px}
  .page{width:100%;padding:8mm}
}

function computeChecks(){
  const items = activeItems(), rev = sumBy(S.revenues,r=>num(r.amount)), exp = sumBy(items,p=>p._v), pers = personnel(items), out=[];
  if (!rev) out.push({l:'err',t:'ยังไม่ได้บันทึกประมาณการรายรับ',d:'ต้องประมาณการรายรับเพื่อใช้ตรวจสอบความสมดุลของงบประมาณ'});
  else if (exp > rev) out.push({l:'err',t:'งบประมาณไม่สมดุล: รายจ่ายสูงกว่ารายรับ',d:`รายจ่าย ${f2(exp)} บาท สูงกว่ารายรับ ${f2(rev)} บาท อยู่ ${f2(exp-rev)} บาท ใช้หน้า “อนุมัติงบประมาณที่ขอ” เพื่อตัดลด`});
  else out.push({l:'ok',t:'งบประมาณสมดุล (รายจ่าย ≤ รายรับ)',d:`ส่วนต่างคงเหลือ ${f2(rev-exp)} บาท`});
  const pp = exp ? pers/exp*100 : 0;
  out.push({l: pp>40?'err':pp>37?'warn':'ok', t:`ค่าใช้จ่ายด้านบุคคล ${pp.toFixed(2)}% ของงบประมาณรายจ่าย`, d:`เกณฑ์ไม่เกิน 40% (ประมาณการ) = ${f2(pers)} บาท`});
  const noAct = S.proposals.filter(p=>p.status!=='rejected' && !hasActual(p));
  if (noAct.length) out.push({l:'warn',t:`${noAct.length} รายการยังไม่กรอกรายจ่ายจริงย้อนหลัง 2 ปี`,d:noAct.slice(0,5).map(p=>'• '+esc(p.dept)+' — '+esc(p.project)).join('<br>')});
  const reserve = sumBy(items.filter(p=>p.type==='เงินสำรองจ่าย'),p=>p._v);
  out.push(reserve>0 ? {l:'ok',t:'ตั้งเงินสำรองจ่ายแล้ว',d:`${f2(reserve)} บาท`} : {l:'warn',t:'ยังไม่ได้ตั้งเงินสำรองจ่ายในงบกลาง',d:'ควรตั้งไว้สำหรับกรณีฉุกเฉินหรือสาธารณภัย'});
  const noRef = items.filter(p=>p.group==='งบลงทุน' && !String(p.planRef||'').trim());
  out.push(noRef.length ? {l:'warn',t:`รายการงบลงทุน ${noRef.length} รายการยังไม่อ้างอิงแผนพัฒนาท้องถิ่น`,d:noRef.slice(0,5).map(p=>'• '+esc(p.project)).join('<br>')} : {l:'ok',t:'รายการงบลงทุนอ้างอิงแผนพัฒนาท้องถิ่นครบถ้วน',d:''});
  const pend = S.proposals.filter(p=>['draft','submitted','revise'].includes(p.status||'draft'));
  out.push(pend.length ? {l:'info',t:`ยังมี ${pend.length} รายการรอดำเนินการ/พิจารณา`,d:`มูลค่ารวม ${f2(sumBy(pend,p=>num(p.amount)))} บาท`} : {l:'ok',t:'พิจารณาคำขอครบทุกรายการแล้ว',d:''});
  const spec = items.filter(p=>p.fund==='เงินอุดหนุนเฉพาะกิจ'); if (spec.length) out.push({l:'warn',t:`มี ${spec.length} รายการแหล่งเงินเป็นเงินอุดหนุนเฉพาะกิจ`,d:'ไม่ต้องตราเป็นเทศบัญญัติงบประมาณรายจ่ายทั่วไป ควรตรวจสอบ'});
  const dl = new Date(S.year-543-1,7,15), days = Math.ceil((dl - new Date())/864e5);
  out.push({l: days<0?'info':days<=30?'warn':'info', t: days>=0 ? `อีก ${days} วันถึงกำหนดเสนอร่างฯ ต่อสภาท้องถิ่น` : 'พ้นกำหนดวันเสนอร่างงบประมาณต่อสภาท้องถิ่นแล้ว', d:`ภายในวันที่ ${thDate(dl)} ตามระเบียบกระทรวงมหาดไทยว่าด้วยวิธีการงบประมาณของ อปท. พ.ศ. 2563`});
  return out;
}

      body += `<tr class="g1"><td colspan="2" style="padding-left:20px">${cat}</td><td class="r">${f2(sumBy(ci,r=>num(r.prev2)))}</td><td class="r">${f2(sumBy(ci,r=>num(r.prev1)))}</td><td class="r">${f2(sumBy(ci,r=>num(r.amount)))}</td><td class="r">${pz(sumBy(ci,r=>num(r.amount)),sumBy(ci,r=>num(r.prev1)))}</td><td></td></tr>`;

async function act(id,a){
  const p = S.proposals.find(x=>x.id===id); if (!p) return;
  const by = S.user.username || S.user.id, t = nowISO();
  if (a==='del') { if (!await confirmBox(`ลบรายการ “${esc(p.project)}” ?`)) return; await busy(()=>DB.del(COL.prop,id)); }
  else if (a==='submit') { if (!hasActual(p)) { toast(`กรุณากรอกรายจ่ายจริงปี ${S.year-3} และ ${S.year-2} ก่อนส่งพิจารณา`,'err'); return openProp(id); }
    await busy(()=>DB.set(COL.prop,id,{status:'submitted',submittedAt:t,updatedAt:t,updatedBy:by})); }
  else if (a==='approve') { if (!isAdmin()) return; await busy(()=>DB.set(COL.prop,id,{status:'approved',amountApproved:finalAmt({...p,status:'approved'}),reviewedAt:t,reviewedBy:by,updatedAt:t,updatedBy:by})); }
  else if (a==='revise' || a==='reject') { if (!isAdmin()) return; const n = await ask(a==='revise'?'ส่งกลับแก้ไข':'ไม่อนุมัติรายการ','เหตุผล / ข้อสังเกต',p.reviewNote||''); if (n===null) return;
    await busy(()=>DB.set(COL.prop,id,{status:a==='revise'?'revise':'rejected',reviewNote:n,reviewedAt:t,reviewedBy:by,updatedAt:t,updatedBy:by})); }
  else if (a==='dup') await busy(()=>DB.add(COL.prop,{...clean(p),project:p.project+' (สำเนา)',status:'draft',amountApproved:null,reviewNote:'',createdAt:t,createdBy:by,updatedAt:t,updatedBy:by}));
  delete S.apv[id]; S.asel.delete(id);
  await reloadProps(); toast('ดำเนินการเรียบร้อย'); refreshView();
}
async function bulk(a){
  const t=nowISO(), by=S.user.username||S.user.id;
  if (a==='submit') { const all=S.proposals.filter(p=>['draft','revise'].includes(p.status||'draft') && (isBudget()||p.dept===S.user.dept));
    const L=all.filter(hasActual), skip=all.length-L.length;
    if (!L.length) return toast('ไม่มีรายการที่พร้อมส่ง (ต้องกรอกรายจ่ายจริงย้อนหลัง 2 ปีก่อน)','warn');

    await busy(()=>DB.batchSet(COL.prop,L.map(p=>[p.id,{status:'submitted',submittedAt:t,updatedAt:t,updatedBy:by}]))); }
  await reloadProps(); toast('ดำเนินการเรียบร้อย'); refreshView();
}

}

const xesc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\r?\n/g,'&#10;');
function toXLS(models){
  const reg = new Map();
  const sid = c => { const bold = c.b||c.th||c.t1 ? 1 : 0, al = c.al || (c.th||c.t1 ? 'c' : 'l');
    const key = [c.bd?1:0,bold,al,c.ind||0,c.n?(c.dec===2?2:0):-1,c.th?'th':c.tot?'tot':'',c.t1?18:16,c.it?1:0].join('|');
    if (!reg.has(key)) reg.set(key,{id:'s'+(reg.size+1),bd:c.bd,bold,al,ind:c.ind||0,nf:c.n?(c.dec===2?'#,##0.00':'#,##0'):'',bg:c.th?'#F2F2F2':c.tot?'#F7F7F7':'',sz:c.t1?18:16,it:c.it,th:c.th});
    return reg.get(key).id; };
  const used = new Set(), sname = n => { let s=String(n).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31), b=s, i=2; while(used.has(s)){ const sf=` (${i++})`; s=b.slice(0,31-sf.length)+sf; } used.add(s); return s; };
  const sheets = models.map(m=>{
    const occ=[]; let rx='';
    m.rows.forEach((row,r)=>{ occ[r]=occ[r]||new Set(); let col=0, cx='';
      row.forEach(c=>{ while(occ[r].has(col)) col++; const cs=c.cs||1, rs=c.rs||1;
        for (let rr=r+1; rr<r+rs; rr++){ occ[rr]=occ[rr]||new Set(); for(let cc=col;cc<col+cs;cc++) occ[rr].add(cc); }
        const v = c.n ? (Math.abs(num(c.v))>0.004 ? `<Data ss:Type="Number">${num(c.v)}</Data>` : '') : (isF(c.v) ? `<Data ss:Type="String">${xesc(c.v)}</Data>` : '');
        cx += `<Cell ss:Index="${col+1}"${cs>1?` ss:MergeAcross="${cs-1}"`:''}${rs>1?` ss:MergeDown="${rs-1}"`:''} ss:StyleID="${sid(c)}">${v}</Cell>`;
        col += cs; });
      rx += `<Row ss:AutoFitHeight="1">${cx}</Row>`; });
    return `<Worksheet ss:Name="${xesc(sname(m.name))}"><Table>${m.cols.map(w=>`<Column ss:AutoFitWidth="0" ss:Width="${Math.round(w*0.75)}"/>`).join('')}${rx}</Table>
<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><PageSetup>${m.land?'<Layout x:Orientation="Landscape"/>':''}<Header x:Margin="0.3"/><Footer x:Margin="0.3"/><PageMargins x:Bottom="0.5" x:Left="0.7" x:Right="0.4" x:Top="0.6"/></PageSetup><FitToPage/><Print><FitHeight>0</FitHeight><ValidPrinterInfo/><PaperSizeIndex>9</PaperSizeIndex></Print></WorksheetOptions></Worksheet>`; }).join('\n');
  const B = '<Borders>' + ['Bottom','Left','Right','Top'].map(p=>`<Border ss:Position="${p}" ss:LineStyle="Continuous" ss:Weight="1"/>`).join('') + '</Borders>';
  const styles = [...reg.values()].map(s=>`<Style ss:ID="${s.id}"><Alignment ss:Horizontal="${s.al==='r'?'Right':s.al==='c'?'Center':'Left'}" ss:Vertical="${s.th?'Center':'Top'}" ss:WrapText="1"${s.ind?` ss:Indent="${s.ind*2}"`:''}/>${s.bd?B:''}<Font ss:FontName="TH Sarabun New" x:CharSet="222" ss:Size="${s.sz}"${s.bold?' ss:Bold="1"':''}${s.it?' ss:Italic="1"':''}/>${s.bg?`<Interior ss:Color="${s.bg}" ss:Pattern="Solid"/>`:''}${s.nf?`<NumberFormat ss:Format="${s.nf}"/>`:''}</Style>`).join('');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40"><Styles><Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Top"/><Font ss:FontName="TH Sarabun New" x:CharSet="222" ss:Size="16"/></Style>${styles}</Styles>\n${sheets}\n</Workbook>`;
}

    await busy(()=>DB.batchSet(COL.prop,ok)); await reloadProps(); refreshView(); toast(`นำเข้า ${ok.length} รายการแล้ว`); }

/* ===================== ALL PLAN DATA PIPELINE: ดึงโครงการจาก ผ.02 (ระบบ 2) & 10 หมู่บ้าน (ระบบ 1) เข้าสู่ e-Budget ===================== */
let _ebPlanCache = [];

async function fetchPlanProjectsForBudget() {
  const out = [];
  let planData = null;
  try { planData = JSON.parse(localStorage.getItem('donkaeo_plan_cache_v2') || 'null'); } catch(e){}
  try {
    const r = await fetch('https://donkaeo-plan71-75-default-rtdb.asia-southeast1.firebasedatabase.app/donkaeo_plan.json');
    if (r.ok) {
      const j = await r.json();
      if (j) {
        planData = {
          issues: (j.plan_tables && j.plan_tables.data && j.plan_tables.data.issues) || (planData && planData.issues) || [],
          p02: (j.plan_p02 && j.plan_p02.data) || (planData && planData.p02) || {},
          supp_p02: (j.plan_supp_p02 && j.plan_supp_p02.data) || (planData && planData.supp_p02) || {}
        };
      }
    }
  } catch(e){}

  if (planData) {
    const issues = Array.isArray(planData.issues) ? planData.issues : Object.values(planData.issues || {});
    const p02 = planData.p02 || {};
    issues.forEach((iss, idx) => {
      const issTitle = (iss && iss.issue) || ('ประเด็นการพัฒนาที่ ' + (idx + 1));
      const arr = Array.isArray(p02['issue_' + idx]) ? p02['issue_' + idx] : Object.values(p02['issue_' + idx] || {});
      arr.forEach((p, pi) => {
        if (!p || !p.project) return;
        const buds = p.budget || {};
        const yrAmt = num(buds[S.year]) || num(buds['2571']) || Object.values(buds).map(num).find(v => v > 0) || 0;
        out.push({
          uid: `m_${idx}_${pi}`,
          label: `[ผ.02 ฉบับแรก ประเด็นที่ ${idx+1} ลำดับ ${pi+1}] ${p.project} (${f2(yrAmt)} บ.)`,
          project: p.project,
          desc: [p.obj ? 'วัตถุประสงค์: ' + p.obj : '', p.target ? 'เป้าหมาย: ' + p.target : '', p.result ? 'ผลที่คาดว่าจะได้รับ: ' + p.result : ''].filter(Boolean).join('\n'),
          amount: yrAmt,
          dept: DEPTS.includes(p.dept) ? p.dept : (S.user?.dept || DEPTS[0]),
          planRef: `แผนพัฒนาท้องถิ่น (พ.ศ. 2571–2575) ประเด็นที่ ${idx+1} ลำดับที่ ${pi+1}`,
          strategy: issTitle
        });
      });

      const supp = planData.supp_p02 || {};
      Object.keys(supp).forEach(ek => {
        if (!/^ed_\d+$/.test(ek)) return;
        const edNo = ek.replace('ed_', '');
        const sArr = Array.isArray(supp[ek]['issue_' + idx]) ? supp[ek]['issue_' + idx] : Object.values((supp[ek] || {})['issue_' + idx] || {});
        sArr.forEach((p, pi) => {
          if (!p || !p.project) return;
          const buds = p.budget || {};
          const yrAmt = num(buds[S.year]) || num(buds['2571']) || Object.values(buds).map(num).find(v => v > 0) || 0;
          out.push({
            uid: `s_${edNo}_${idx}_${pi}`,
            label: `[ผ.02 เพิ่มเติม ฉ.${edNo} ประเด็นที่ ${idx+1} ลำดับ ${pi+1}] ${p.project} (${f2(yrAmt)} บ.)`,
            project: p.project,
            desc: [p.obj ? 'วัตถุประสงค์: ' + p.obj : '', p.target ? 'เป้าหมาย: ' + p.target : ''].filter(Boolean).join('\n'),
            amount: yrAmt,
            dept: DEPTS.includes(p.dept) ? p.dept : (S.user?.dept || DEPTS[0]),
            planRef: `แผนพัฒนาท้องถิ่น (พ.ศ. 2571–2575) เพิ่มเติม ฉบับที่ ${edNo} ประเด็นที่ ${idx+1} ลำดับที่ ${pi+1}`,
            strategy: issTitle
          });
        });
      });
    });
  }

  // ดึงจากความต้องการ 10 หมู่บ้าน (infra-needs.html)
  try {
    const infLocal = JSON.parse(localStorage.getItem('donkaew_localplan_v4') || '[]');
    if (Array.isArray(infLocal)) {
      infLocal.forEach(r => {
        if (!r || !r.title) return;
        const dName = (Array.isArray(r.components) && r.components[0] && r.components[0].dept) || (r.cat === 'infra' ? 'กองช่าง' : 'สำนักปลัดเทศบาล');
        out.push({
          uid: `inf_${r.id}`,
          label: `[ความต้องการ หมู่ที่ ${r.village} ลำดับ ${r.priority||1}] ${r.title} (${f2(r.budget)} บ.)`,
          project: r.title,
          desc: [r.reason ? 'เหตุผลความจำเป็น: ' + r.reason : '', r.qtyDesc ? 'ปริมาณงาน: ' + r.qtyDesc : ''].filter(Boolean).join('\n'),
          amount: num(r.budget),
          dept: DEPTS.includes(dName) ? dName : 'กองช่าง',
          planRef: `บัญชีความต้องการหมู่ที่ ${r.village} ลำดับที่ ${r.priority||1} (ปี ${r.year})`,
          strategy: 'การพัฒนาโครงสร้างพื้นฐานและครุภัณฑ์ตามความต้องการของหมู่บ้าน'
        });
      });
    }
  } catch(e){}

  return out;
}

async function bindPlanPickerInModal(fillWork, fillCat) {
  const sel = $('#f_planPicker'), btn = $('#f_applyPlanProj');
  if (!sel || !btn) return;
  _ebPlanCache = await fetchPlanProjectsForBudget();
  if (!_ebPlanCache.length) {
    sel.innerHTML = '<option value="">— ยังไม่มีโครงการในระบบแผนพัฒนาท้องถิ่น (ผ.02) หรือระบบ 10 หมู่บ้าน —</option>';
    return;
  }
  sel.innerHTML = '<option value="">— เลือกโครงการจากแผนพัฒนาท้องถิ่น (ผ.02) หรือความต้องการ 10 หมู่บ้าน (' + _ebPlanCache.length + ' รายการ) —</option>' +
    _ebPlanCache.map(x => `<option value="${esc(x.uid)}">${esc(x.label)}</option>`).join('');

  btn.onclick = () => {
    const uid = sel.value;
    if (!uid) return toast('กรุณาเลือกโครงการจากรายการก่อน', 'warn');
    const item = _ebPlanCache.find(x => x.uid === uid);
    if (!item) return;
    $('#f_project').value = item.project;
    $('#f_desc').value = item.desc;
    $('#f_amount').value = item.amount;
    $('#f_ref').value = item.planRef;
    $('#f_strat').value = item.strategy;
    if (!$('#f_prev3').value) $('#f_prev3').value = 0;
    if (!$('#f_prev2').value) $('#f_prev2').value = 0;
    if (!$('#f_prev1').value) $('#f_prev1').value = 0;
    if (DEPTS.includes(item.dept) && !$('#f_dept').disabled) {
      $('#f_dept').value = item.dept;
      const d = DEPT_DEFAULT[item.dept];
      if (d) { $('#f_plan').value = d[0]; fillWork(); $('#f_work').value = d[1]; }
    }
    $('#f_auto').click();
    toast('ดึงข้อมูลโครงการ งบประมาณ และเลขหน้าอ้างอิงแผนพัฒนาฯ เรียบร้อยแล้ว');
  };
}

async function openPullFromPlanModal() {
  const list = await fetchPlanProjectsForBudget();
  if (!list.length) return toast('ไม่พบโครงการในระบบแผนพัฒนาท้องถิ่น (ผ.02) หรือความต้องการ 10 หมู่บ้าน', 'warn');
  modal('📥 ดึงโครงการจากแผนพัฒนาท้องถิ่น (ผ.02) มาตั้งงบประมาณรายจ่ายประจำปี ' + S.year, `
    <div class="hint" style="margin-bottom:12px">เลือกรายการโครงการจากแผนพัฒนาท้องถิ่น (ผ.02) หรือบัญชีความต้องการ 10 หมู่บ้าน ระบบจะจับคู่หมวดรายจ่าย แผนงาน/งาน และเติมช่องอ้างอิงแผนพัฒนาท้องถิ่นให้อัตโนมัติ</div>
    <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
      <label class="chip" style="cursor:pointer"><input type="checkbox" onchange="document.querySelectorAll('.eb-imp-chk').forEach(c=>c.checked=this.checked)"> เลือกทั้งหมด (${list.length} โครงการ)</label>
      <span class="small muted">ปีงบประมาณเป้าหมาย: พ.ศ. ${S.year}</span>
    </div>
    <div style="max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)">
      <table class="t"><thead><tr><th style="width:36px"></th><th>โครงการ / อ้างอิงแผน</th><th>ส่วนราชการ</th><th class="r">งบตามแผน (บาท)</th></tr></thead>
      <tbody>${list.map(x => `<tr>
        <td><input type="checkbox" class="eb-imp-chk" value="${esc(x.uid)}"></td>
        <td><div class="proj">${esc(x.project)}</div><div class="small muted">${esc(x.planRef)}</div></td>
        <td><span class="badge b-sec">${esc(x.dept)}</span></td>
        <td class="r"><b>${f2(x.amount)}</b></td>
      </tr>`).join('')}</tbody></table>
    </div>
  `, { wide: true, ok: '📥 นำเข้าเป็นคำขอตั้งงบประมาณ', onOk: async () => {
    const chks = [...document.querySelectorAll('.eb-imp-chk:checked')].map(c => c.value);
    if (!chks.length) { toast('กรุณาติ๊กเลือกโครงการอย่างน้อย 1 รายการ', 'warn'); return false; }
    const picked = list.filter(x => chks.includes(x.uid));
    const by = S.user.username || S.user.id, tm = nowISO();
    const batch = picked.map(x => {
      const def = DEPT_DEFAULT[x.dept] || ['แผนงานเคหะและชุมชน', 'งานไฟฟ้าและประปา'];
      const t = suggestType(x.project + ' ' + x.desc) || 'ค่าก่อสร้างสิ่งสาธารณูปโภค';
      const rec = autoMatch({
        year: S.year, dept: x.dept, plan: def[0], work: def[1],
        type: t, project: x.project, desc: x.desc,
        fund: 'เงินรายได้', planRef: x.planRef, strategy: x.strategy,
        prev3: 0, prev2: 0, prev1: 0, amount: num(x.amount),
        amountApproved: null, status: 'draft', createdAt: tm, createdBy: by, updatedAt: tm, updatedBy: by
      });
      return [uid(), rec];
    });
    await busy(() => DB.batchSet(COL.prop, batch));
    await reloadProps();
    refreshView();
    toast(`นำเข้าโครงการจากแผนพัฒนาท้องถิ่นจำนวน ${batch.length} รายการเรียบร้อยแล้ว`);
  }});
}

/* --- All Plan SSO Bridge --- */
(function(){
  async function applyEbSSO(u) {
    if (!u || !u.perms || u.perms.ebudget === "none") return;
    const usr = {
      id: u.uid, username: u.email || u.uid, displayName: u.name,
      dept: u.dept, role: u.perms.ebudget, budgetRole: u.perms.ebudget,
      passwordHash: u.passwordHash || "", active: true
    };
    try { await DB.set(COL.users, u.uid, usr); } catch(err){}
    if (!S.user || S.user.id !== u.uid || S.user.budgetRole !== u.perms.ebudget) {
      await startSession(usr);
    }
  }
  const saved = JSON.parse(localStorage.getItem("allplan_session_v1") || "null");
  if (saved) setTimeout(() => applyEbSSO(saved), 200);
  window.addEventListener("message", e => {
    if (e.data && e.data.type === "ALLPLAN_SSO") applyEbSSO(e.data.user);
  });
})();
</script>
